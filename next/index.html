<style>
/* Layout: a 2D engineering schematic you pan and zoom. Rafiul is the core; each project is a module wired to it,
   with a spec sheet that opens on click. Design-tool chrome (rulers, crosshair, coordinates) frames the board.
   Single dark theme by choice: industrial instrument panel. */
:root {
  --bg: #08090c; --grid: #11161c; --grid-major: #1a212a; --panel: #0e1217; --raised: #141a21; --line: #26303b;
  --ink: #e9edf1; --muted: #8893a1; --dim: #78838f; --amber: #f2b705; --pass: #39d98a; --trace: #3a4654;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--display); overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
/* Inside the scaled board the ring keeps a fixed on-screen thickness (--s is the camera scale). */
#world :focus-visible { outline-width: round(up, calc(2px / var(--s, 1)), 1px); outline-offset: round(up, calc(2px / var(--s, 1)), 1px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- chrome: top bar, rulers, HUD ---- */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(44px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.mark { font: 800 17px/1 var(--display); font-stretch: 125%; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.mark i { width: 10px; height: 10px; background: var(--amber); display: inline-block; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.crumb { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.tbtn { background: var(--raised); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; font: 500 12px var(--mono); cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
@media (pointer: coarse) { .tbtn { min-height: 44px; padding: 10px 14px; } .kbd { display: none; } }
/* In the 44px top bar, full-height buttons touched both edges; inset them (still well above the 24px target minimum). */
@media (pointer: coarse) { .bar .tbtn { min-height: 36px; padding: 6px 14px; } }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ruler { position: fixed; z-index: 20; background: var(--panel); pointer-events: none; }
.ruler.x { top: calc(44px + env(safe-area-inset-top, 0px)); left: 22px; right: 0; height: 22px; border-bottom: 1px solid var(--line); }
.ruler.y { top: calc(66px + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; width: 22px; border-right: 1px solid var(--line); }
.ruler canvas { display: block; }
.corner { position: fixed; z-index: 21; top: calc(44px + env(safe-area-inset-top, 0px)); left: 0; width: 22px; height: 22px; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.hud { position: fixed; z-index: 25; left: 34px; right: 260px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.hud span { white-space: pre; font: 500 11.5px var(--mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.zoomer { position: fixed; z-index: 25; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }

/* ---- the board ---- */
#stage { position: fixed; inset: calc(66px + env(safe-area-inset-top, 0px)) 0 0 22px; overflow: clip; cursor: grab; touch-action: none; }
#stage.drag { cursor: grabbing; }
#grid { position: absolute; inset: 0; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#traces { position: absolute; overflow: visible; pointer-events: none; }
.xh { position: absolute; pointer-events: none; background: color-mix(in srgb, var(--amber) 35%, transparent); }
.xh.v { top: 0; bottom: 0; width: 1px; } .xh.h { left: 0; right: 0; height: 1px; }

.core { position: absolute; width: 440px; padding: 22px 24px 20px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--amber); }
.core .tag { font: 600 11px var(--mono); color: var(--amber); letter-spacing: .14em; }
.core h1 { margin: 10px 0 6px; font: 800 44px/0.95 var(--display); font-stretch: 112%; letter-spacing: -.01em; text-wrap: balance; }
.core .who { font: 500 13px var(--mono); color: var(--muted); }
.core .links { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.core .links a { font: 500 12px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; text-decoration: none; background: var(--raised); }
.core .links a:hover { border-color: var(--amber); color: var(--amber); }

.zone { position: absolute; font: 600 11px var(--mono); color: var(--dim); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.zone::before { content: ""; display: inline-block; width: 18px; height: 1px; background: var(--dim); vertical-align: middle; margin-right: 8px; }

.mod { position: absolute; width: 272px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 0; cursor: pointer; display: grid; transition: border-color .15s; }
.mod:hover, .mod.sel { border-color: var(--amber); }
.mod.sel { box-shadow: 0 0 0 1px var(--amber), 0 0 40px -12px var(--amber); }
.mod .mh { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 600 11px var(--mono); color: var(--muted); letter-spacing: .08em; }
.led { display: inline-flex; align-items: center; gap: 6px; }
.led::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.led.live { color: var(--pass); } .led.repo { color: #7fb4ff; } .led.beta { color: var(--amber); } .led.stage { color: #c79bff; }
.mod .mb { padding: 12px 12px 12px; display: grid; gap: 6px; }
.mod .mn, .mod .md { display: block; }
.mod .mn { font: 700 19px/1.1 var(--display); font-stretch: 105%; }
.mod .md { font-size: 13.5px; color: #bcc4cd; line-height: 1.42; }
.mod .mf { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px dashed var(--line); font: 500 11px var(--mono); color: var(--dim); }
.mod .mf b { color: var(--muted); font-weight: 500; }

/* ---- spec sheet ---- */
#sheet { position: fixed; z-index: 40; top: calc(66px + env(safe-area-inset-top, 0px)); right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .22s ease; overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 14px; align-content: start; }
#sheet.open { transform: none; }
#shTitle:focus, #sheet:focus { outline: none; }
#sheet code { font: 500 12.5px var(--mono); white-space: nowrap; color: var(--ink); }
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 600 11px var(--mono); color: var(--muted); letter-spacing: .1em; }
#sheet h2 { margin: 0; font: 800 30px/1 var(--display); font-stretch: 110%; text-wrap: balance; }
#sheet .lead { margin: 0; color: #c9d0d7; }
.spec { border: 1px solid var(--line); border-radius: 2px; }
.spec div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.spec div:last-child { border-bottom: 0; }
.spec dt { font: 500 11.5px/1.9 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.spec dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.blk h3 { margin: 0 0 6px; font: 600 11px var(--mono); color: var(--amber); letter-spacing: .14em; text-transform: uppercase; }
.blk ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: #c9d0d7; font-size: 14px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.acts a { font: 600 12.5px var(--mono); text-decoration: none; padding: 8px 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--raised); }
.acts a.pri { background: var(--amber); color: #111; border-color: var(--amber); }
.acts .soon { font: 600 12.5px var(--mono); padding: 8px 12px; border-radius: 3px; border: 1px dashed var(--line); color: var(--muted); }

/* ---- list view (also the phone default) ---- */
#list { position: fixed; z-index: 15; inset: calc(44px + env(safe-area-inset-top, 0px)) 0 0 0; overflow-y: auto; background: var(--bg);
  padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#list .inner { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
#list .core, #list .journal, #list .mod { position: static; width: auto; }
#list .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
#list .zone { position: static; margin-top: 8px; }
body.listmode .ruler, body.listmode .corner, body.listmode .hud, body.listmode .zoomer { display: none; }
body.listmode #sheet { top: calc(44px + env(safe-area-inset-top, 0px)); }
/* While a sheet is open the zoom buttons move left of it instead of hiding under it; on narrow screens the sheet covers everything, so they hide. */
@media (min-width: 761px) { body.sheetopen .zoomer { right: calc(min(440px, 100%) + 14px); } }
@media (max-width: 760px) { body.sheetopen .zoomer { visibility: hidden; } }
@media (max-width: 1100px) { body.sheetopen .hud { display: none; } }
@media (max-width: 760px) { .core h1 { font-size: 38px; } .crumb { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v2 / quiet instrument. Text and chrome stay on a flat plane; only the substrate tilts.
   All animated properties are transform/opacity. No animated filters, shadows or SVG dashes. */
#stage { isolation: isolate; }
#grid { transform-origin: 50% 50%; }
#depth { position: absolute; inset: 0; pointer-events: none; }
#world { pointer-events: auto; }
#stage::before, #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
#stage::before { z-index: -1; background: radial-gradient(ellipse at 39% 47%, #f2b70508, transparent 57%); }
#stage::after { z-index: 4; background: radial-gradient(ellipse at 50% 48%, transparent 48%, #08090c65 100%); }
/* The vignette shades the substrate, never the text: the card plane sits above it. */
#depth { z-index: 5; }
/* A lifted card keeps its old footprint clickable, so the pointer never falls through the gap it leaves. */
#world .mod::before { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; }
/* HUD readouts change often; keep each one from invalidating page layout. */
.hud span { contain: layout paint; }
#vMotion[aria-pressed="false"] { color: var(--muted); }
@media (max-width: 760px) { #vMotion { display: none; } }
/* An optical texture, not an animated filter over text. */
#scanline { position: absolute; inset: -24px 0; pointer-events: none; opacity: 0;
  background: repeating-linear-gradient(0deg, transparent 0 5px, #b9c5d9 5px 6px); }
.trace-fx { position: absolute; left: 0; top: 0; pointer-events: none; }
.trace-pulse { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%;
  background: #ffe7a2; box-shadow: 0 0 7px 2px #f2b70538; opacity: 0; }
.trace-segment { position: absolute; background: var(--trace); transform-origin: 0 50%; }
.trace-highlight { opacity: 0; }
.trace-highlight.active { opacity: .85; }
.mod { transition: none; }
.mod::after { content: ""; position: absolute; inset: -1px; border: 1px solid #f2b705a0; border-radius: inherit;
  box-shadow: 0 8px 28px -12px #f2b70545, 0 0 16px -7px #f2b70533; opacity: 0; pointer-events: none; }
.mod:is(:hover, :focus-visible, .sel)::after { opacity: 1; }
.mod.sel { box-shadow: none; }
#list .mod { position: relative; }
#world .core { box-shadow: 0 18px 50px -24px #000a; }
.hud #hClock { color: #9aa3ae; }
body.listmode #depth { visibility: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .mod { transition: transform 280ms cubic-bezier(.22,1,.36,1); }
  .mod::after, .trace-highlight { transition: opacity 220ms ease-out; }
  @media (hover: hover) and (pointer: fine) {
    .mod:hover { transform: translateY(-4px); }
  }
  .mod:focus-visible { transform: translateY(-4px); }
  body.sheetopen #world .mod, #stage.drag .mod { transform: none; }
  #sheet { transition: transform 320ms cubic-bezier(.22,1,.36,1); }
  #stage.booting #traces { opacity: 0; }
  #stage.pending #world { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  #depth, #grid { transform: none !important; }
  .trace-fx, #scanline, .xh { display: none !important; }
}


/* v3 / follow the evidence. The opening camera frames the core and four security projects.
   The remaining projects retain their board positions and can also be read in order in List. */
.core { width: 480px; padding: 24px; }
.core h1 { font-size: 54px; margin: 12px 0 8px; }
.core .who { font-size: 11.5px; }
.core .role { margin: 20px 0 8px; font: 600 16px/1.4 var(--display); }
.core .value { margin: 0; font: 650 27px/1.2 var(--display); letter-spacing: -.025em; text-wrap: balance; }
.core .seeking { margin: 20px 0 0; padding-left: 12px; border-left: 2px solid var(--amber); color: var(--ink); font-size: 15px; line-height: 1.5; }
.core .education { margin: 16px 0 0; font-size: 12.5px; line-height: 1.65; color: #b5c0cc; }
.core .links { gap: 7px; margin-top: 18px; }
/* Contact is the recruiter's next step: it must stay legible (≥ 11 px rendered) at the 1280×720 opening zoom. */
.core .links a { font-size: 13.5px; padding: 7px 10px; }
.core .browse { display: inline-block; margin-top: 16px; color: var(--muted); font: 500 12px var(--mono); text-decoration: none; }
.core .browse:hover { color: var(--amber); }
/* The handle is the identity; the name signs the card, on the line that already exists (no extra height). */
.core .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-top: 16px; }
.core .foot .browse { margin-top: 0; }
.core .sig { font: 500 12px var(--mono); color: #aab3bd; letter-spacing: .04em; }
.mod { width: 280px; }
.mod.featured { width: 600px; border-top: 2px solid var(--amber); background: linear-gradient(125deg, #181a17, var(--panel) 65%); }
.mod.featured .mb { padding: 18px; gap: 10px; }
.mod.featured .mn { font-size: 29px; }
.mod.featured .md { font-size: 16px; line-height: 1.5; max-width: 52ch; }
.mod.featured .mh, .mod.featured .mf { padding-inline: 18px; }
.mod .project-action { margin-left: auto; color: var(--amber); }
.journal { position: absolute; width: 280px; padding: 16px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid #8893a1; border-radius: 2px; cursor: pointer; }
.journal:hover, .journal:focus-visible, .journal.sel { border-color: var(--amber); }
.journal > span { display: block; }
.journal .journal-meta { color: var(--dim); font: 500 10.5px/1.5 var(--mono); }
.journal .journal-title { margin-top: 9px; font: 700 20px/1.2 var(--display); }
.journal .journal-intro { margin-top: 8px; color: #bcc4cd; font-size: 13px; line-height: 1.5; }
.journal .journal-action { margin-top: 12px; font: 500 11.5px var(--mono); color: var(--amber); }
.journal-entries { list-style: none; padding: 0; margin: 0; display: grid; gap: 24px; counter-reset: entry; }
.journal-entries li { padding-top: 16px; border-top: 1px solid var(--line); }
.journal-entries time { font: 500 11px var(--mono); color: var(--muted); }
.journal-entries h3 { margin: 8px 0 12px; font: 700 20px/1.2 var(--display); }
.journal-entries dl { margin: 0; display: grid; gap: 10px; }
.journal-entries dl div { display: grid; gap: 3px; }
.journal-entries dt { font: 500 10.5px var(--mono); color: var(--amber); }
.journal-entries dd { margin: 0; font-size: 14px; color: #c9d0d7; }
.journal-provenance, .project-note { margin: 0; font-size: 13px; line-height: 1.6; color: #b5c0cc; }
.journal-provenance a { text-underline-offset: 3px; }
#list .mod.featured { width: auto; grid-column: 1 / -1; }
#list .journal { width: auto; }
#list .journal-collection { display: grid; gap: 12px; }
#list .zone { margin-top: 12px; }
@media (max-width: 760px) {
  .core { padding: 20px; }
  .core h1 { font-size: 46px; }
  .core .value { font-size: 25px; }
  .core .role { font-size: 15px; }
  .core .links a { min-height: 40px; display: inline-flex; align-items: center; }
  #list .mod.featured .mn { font-size: 25px; }
}


/* v4 / experience record. The teaser uses the journal's existing dialog interaction. */
.led.private { color: #a8b1c2; }
.resume-teaser { width: 480px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 16px; border-left-color: var(--amber); }
.resume-teaser .journal-title, .resume-teaser .journal-intro, .resume-teaser .journal-action { margin: 0; }
.resume-teaser .journal-title, .resume-teaser .journal-intro { grid-column: 1 / -1; }
.resume-teaser .journal-action { grid-column: 2; grid-row: 1; align-self: center; }
.resume-teaser .journal-title { font-size: 20px; }
.resume-teaser .journal-intro { font-size: 12px; }
.resume-section { border-top: 1px solid var(--line); padding-top: 18px; }
.resume-section > h3 { margin: 0 0 16px; font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.resume-role + .resume-role { margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--line); }
.resume-role h4 { margin: 6px 0; font: 700 21px/1.2 var(--display); }
.resume-role .position { margin: 0 0 6px; color: var(--ink); font-weight: 600; }
.resume-date { font: 500 11px/1.6 var(--mono); color: var(--muted); }
.resume-promotion { margin: 6px 0 12px; font-size: 12.5px; color: #d2b969; }
.resume-role ul { margin: 12px 0 0; padding-left: 17px; display: grid; gap: 10px; font-size: 14px; color: #c9d0d7; }
.resume-certifications { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 9px; }
.resume-certifications li { display: flex; justify-content: space-between; gap: 16px; color: #c9d0d7; font-size: 14px; }
.resume-certifications time { flex: 0 0 auto; color: var(--muted); font: 500 11px/1.9 var(--mono); }
.resume-education { border-left: 2px solid var(--line); padding-left: 12px; font-size: 14px; }
.resume-education p { margin: 5px 0; color: #c9d0d7; }
.resume-skills { margin: 0; display: grid; gap: 14px; }
.resume-skills dt { margin-bottom: 5px; font-weight: 600; font-size: 14px; }
.resume-skills dd { margin: 0; color: #b5c0cc; font-size: 13.5px; line-height: 1.6; }
#list .resume-teaser { position: static; width: auto; }

</style>

<header class="bar">
  <span class="mark"><i aria-hidden="true"></i>blurxy</span>
  <span class="crumb" id="crumb">board / blurxy / all modules</span>
  <span class="spacer"></span>
  <button class="tbtn" id="vMotion" aria-pressed="true" title="Pause or resume the board's ambient motion">Motion</button>
  <button class="tbtn" id="vBoard" aria-pressed="true">Board</button>
  <button class="tbtn" id="vList" aria-pressed="false">List</button>
</header>

<div class="corner" aria-hidden="true"></div>
<div class="ruler x" aria-hidden="true"><canvas id="rx"></canvas></div>
<div class="ruler y" aria-hidden="true"><canvas id="ry"></canvas></div>

<main id="stage" class="pending" aria-label="Project board. Drag to pan, scroll to zoom, or switch to List.">
  <canvas id="grid" aria-hidden="true"></canvas>
  <div class="xh v" id="xv" hidden></div><div class="xh h" id="xhz" hidden></div>
  <div id="scanline" aria-hidden="true"></div>
  <div id="depth"><div id="world"><svg id="traces" aria-hidden="true"></svg></div></div>

      depth.style.transform = `translate(${(x * 3).toFixed(3)}px,${(y * 2).toFixed(3)}px)`;
      grid.style.transform = `perspective(1400px) rotateX(${(-y * .35).toFixed(3)}deg) rotateY(${(x * .35).toFixed(3)}deg) translate(${(-x * 2).toFixed(3)}px,${(-y * 2).toFixed(3)}px) scale(1.015)`;
    }
    function aim(a, b) { tx = a; ty = b; if (!raf && allowed() && fine.matches) raf = requestAnimationFrame(settle); }
    function timecode() {
      const time = new Date(); $('hClock').textContent = 'LOCAL ' + [time.getHours(), time.getMinutes(), time.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
    }
    // The clock is independent of the pulses: it ticks while motion is on and the tab is visible, and is hidden
    // (never left showing a stale time) when motion is paused or reduced.
    function clockSync() {
      const on = enabled && !preference.matches && !document.hidden;
      $('hClock').hidden = !on;
      if (on && !clockTimer) { timecode(); clockTimer = setInterval(timecode, 1000); }
      else if (!on && clockTimer) { clearInterval(clockTimer); clockTimer = 0; }
    }
    function armIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { idled = true; stopAmbient(); }, IDLE_MS);
    }
    function poke() { if (idled) { idled = false; ambient(); } else if (pulseTimer || pulse) armIdle(); }
    function stopAmbient() {
      clearTimeout(pulseTimer); pulseTimer = 0;
      if (pulse) { pulse.animation.cancel(); pulse.el.remove(); pulse = null; }
      if (scanAnimation) { scanAnimation.cancel(); scanAnimation = null; }
      scan.style.opacity = 0;
    }
    function nextPulse() {
      if (!allowed() || hovering || !booted || !routes.length) return;
      // Exactly one packet on the board at once; every module receives it in turn.
      const route = routes[pulseIndex++ % routes.length];
      const el = document.createElement('i'); el.className = 'trace-pulse'; fx.appendChild(el);
      const points = route.points.filter((p, i, all) => !i || p[0] !== all[i-1][0] || p[1] !== all[i-1][1]);
      let total = 0; const lengths = points.map((p, i) => i ? (total += Math.hypot(p[0]-points[i-1][0], p[1]-points[i-1][1])) : 0);
      const frames = points.map(([px, py], i) => ({transform: `translate(${px}px,${py}px)`, offset: total ? lengths[i]/total : i/(points.length-1)}));
      // Fixed opacity avoids a second independent animation; the dot terminates under the port.
      el.style.opacity = '.48';
      const animation = animate(el, frames, {duration: Math.max(1700, Math.min(3000, total * 7)), easing: 'linear'});
      pulse = {el, animation};
      animation.onfinish = () => { el.remove(); pulse = null; pulseTimer = setTimeout(nextPulse, 1700); };
    }
    function ambient() {
      // Pulses run only for a mouse user who is present: not on touch-only devices, not after IDLE_MS of no input.
      // (The former full-stage scanline animated forever at opacity .012, invisible but ~60 compositor frames/s; removed.)
      stopAmbient(); if (!allowed() || !booted || idled || !fine.matches) return;
      if (!hovering) pulseTimer = setTimeout(nextPulse, 1600);
      armIdle();
    }
    function finishBoot() {
      clearTimeout(bootTimer); bootTimer = 0;
      boot.forEach(a => a.cancel()); boot = [];
      fx.querySelectorAll('.trace-segment').forEach(el => el.remove());
      stage.classList.remove('booting'); booted = true;
    }
    function powerOn() {
      if (booted) return;
      if (!allowed() || dirty || location.hash) { finishBoot(); ambient(); return; }
      stage.classList.add('booting');
      // The core card (who / role / contact) is readable from the first frame; only the board around it powers on.
      // A deterministic clockwise sweep, beginning above the core.
      routes.sort((a,b) => angle(a) - angle(b));
      function angle(r) { const m = MODS.find(m => m.key === r.k); return (Math.atan2(m.y - CORE.y, m.x - CORE.x) + Math.PI/2 + Math.PI*2) % (Math.PI*2); }
      routes.forEach((r, index) => {
        const delay = 180 + index * 65;
        const lengths = r.points.slice(1).map((p,i) => Math.hypot(p[0]-r.points[i][0],p[1]-r.points[i][1]));
        const total = lengths.reduce((a,b) => a+b,0); let elapsed = 0;
        lengths.forEach((length, i) => {
          if (!length) return;
          const a = r.points[i], b = r.points[i+1], horizontal = a[1] === b[1];
          const el = document.createElement('i'); el.className = 'trace-segment';
          el.style.cssText = `left:${Math.min(a[0],b[0])-.75}px;top:${Math.min(a[1],b[1])-.75}px;width:${horizontal?length:1.5}px;height:${horizontal?1.5:length}px;transform-origin:${horizontal?(b[0]>a[0]?'left':'right')+' center':'center '+(b[1]>a[1]?'top':'bottom')}`;
          fx.appendChild(el); const duration = 900 * length / total;
          boot.push(animate(el, [{transform: horizontal?'scaleX(0)':'scaleY(0)'}, {transform: horizontal?'scaleX(1)':'scaleY(1)'}], {duration, delay: delay + elapsed, easing: 'linear', fill: 'both'})); elapsed += duration;
        });
        boot.push(animate(modEls[r.k], [{opacity: 0, transform: 'translateY(7px)'}, {opacity: 1, transform: 'translateY(0)'}], {duration: 540, delay: delay + 650, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'both'}));
      });
      [journal, ...world.querySelectorAll('.zone')].forEach(el => boot.push(animate(el, [{opacity: 0}, {opacity: 1}], {duration: 650, delay: 950, fill: 'both'})));
      bootTimer = setTimeout(() => { finishBoot(); ambient(); }, 1500 + routes.length * 65);
    }
    function sync() {
      clockSync();
      if (!allowed()) { finishBoot(); stopAmbient(); clearDepth(); }
      else ambient();
    }
    function setEnabled(on) {
      enabled = on; $('vMotion').setAttribute('aria-pressed', String(on));
      try { localStorage.setItem('blurxy-motion', on ? 'on' : 'off'); } catch (_) {}
      idled = false; sync();
    }
    $('vMotion').setAttribute('aria-pressed', String(enabled));
    $('vMotion').addEventListener('click', () => setEnabled(!enabled));
    function wire(paths) {
      // Font loads / breakpoint changes replace geometry, never replay the boot.
      if (boot.length) finishBoot();
      routes = paths; highlight(hovering); if (booted) ambient();
    }
    function interrupt() { if (!booted) { finishBoot(); ambient(); } }
    // Any real input wakes idle pulses (and pushes the idle deadline back).
    for (const t of ['pointerdown', 'keydown', 'wheel']) document.addEventListener(t, poke, {passive: true, capture: true});
    stage.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || !e.isPrimary) return;
      poke();
      if (e.buttons) { stopAmbient(); clearDepth(); return; }
      if (allowed()) aim(Math.max(-1,Math.min(1, (e.clientX-bounds.left)/bounds.width*2-1)), Math.max(-1,Math.min(1,(e.clientY-bounds.top)/bounds.height*2-1)));
    }, {passive: true});
    stage.addEventListener('pointerleave', () => aim(0,0));
    stage.addEventListener('pointerdown', () => { interrupt(); stopAmbient(); clearDepth(); }, {passive: true});
    window.addEventListener('pointerup', () => ambient(), {passive: true});
    window.addEventListener('pointercancel', () => ambient(), {passive: true});
    document.addEventListener('keydown', interrupt, {capture: true});
    stage.addEventListener('wheel', () => { interrupt(); clearDepth(); }, {passive: true});
    document.querySelector('.bar').addEventListener('pointerdown', interrupt, {passive: true});
    stage.addEventListener('pointerover', e => {
      const card = e.target.closest('.mod'); const key = card?.dataset.key || null;
      if (key === hovering) return; hovering = key; highlight(key); ambient();
    });
    stage.addEventListener('pointerleave', () => { hovering = null; highlight(null); ambient(); });
    // Only keyboard focus lights a trace; focus restored by a mouse/touch close must not leave a stuck highlight.
    stage.addEventListener('focusin', e => { interrupt(); highlight(e.target.matches(':focus-visible') ? e.target.closest('.mod')?.dataset.key : hovering); });
    stage.addEventListener('focusout', () => highlight(hovering));
    preference.addEventListener('change', sync); fine.addEventListener('change', () => { clearDepth(); sync(); });
    document.addEventListener('visibilitychange', sync);
    window.addEventListener('blur', () => { interrupt(); stopAmbient(); clearDepth(); });
    window.addEventListener('focus', sync);
    window.addEventListener('resize', () => { bounds = stage.getBoundingClientRect(); clearDepth(); });
    clockSync();
    return {wire, highlight, sync, powerOn, reduced: () => preference.matches, rect: () => bounds};
  })();

  // One breakpoint for CSS and JS. Narrowing past it switches to the list; widening keeps whatever view is showing.
  const narrow = matchMedia('(max-width: 760px)');
  narrow.addEventListener('change', e => { requestAnimationFrame(() => { placeBoard(); drawTraces(); }); if (e.matches) setView('list'); syncAccessibility(); });
  let rz = 0;
  window.addEventListener('resize', () => { if (rz) return; rz = requestAnimationFrame(() => { rz = 0; syncAccessibility(); if (!$('list').hidden) return; if (!dirty) home(); else apply(); if (current) focusOn(boardItem(current)); }); });
  const start = () => requestAnimationFrame(() => { if (narrow.matches) setView('list'); placeBoard(); drawTraces(); if ($('list').hidden) home(); stage.classList.remove('pending'); motion.powerOn(); const h0 = hashKey(); if (item(h0)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} open(h0); } });
  if (document.fonts && document.fonts.status !== 'loaded') {
    let started = false;
    const launch = () => { if (started) return; started = true; start(); };
    // The world stays hidden (#stage.pending) until fonts are in, so waiting costs no visible flash; 1 s covers a cold
    // first visit, after which a late font only re-measures and the boot reveal is cut short rather than delayed further.
    const fallback = setTimeout(launch, 1000);
    document.fonts.ready.then(() => {
      clearTimeout(fallback);
      if (!started) launch();
      else { placeBoard(); drawTraces(); if ($('list').hidden && !dirty) home(); }
    });
  } else start();
})();
</script>
