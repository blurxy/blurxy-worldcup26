/* Layout: a 2D engineering schematic you pan and zoom. Rafiul is the core; each project is a module wired to it,

:root {

  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--display); overflow: hidden; -webkit-font-smoothing: antialiased; }

#sheet { position: fixed; z-index: 40; top: calc(66px + env(safe-area-inset-top, 0px)); right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line);

  padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

#list .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
#list .zone { position: static; margin-top: 8px; }
body.listmode .ruler, body.listmode .corner, body.listmode .hud, body.listmode .zoomer { display: none; }
body.listmode #sheet { top: calc(44px + env(safe-area-inset-top, 0px)); }
/* While a sheet is open the zoom buttons move left of it instead of hiding under it; on narrow screens the sheet covers everything, so they hide. */
@media (min-width: 761px) { body.sheetopen .zoomer { right: calc(min(440px, 100%) + 14px); } }
@media (max-width: 760px) { body.sheetopen .zoomer { visibility: hidden; } }
@media (max-width: 1100px) { body.sheetopen .hud { display: none; } }
@media (max-width: 760px) { .core h1 { font-size: 38px; } .crumb { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const LED = { live: "LIVE", repo: "REPO", beta: "BETA", stage: "STAGING" };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const world = $('world'), stage = $('stage');

  // ---------- build board ----------
  const core = document.createElement('section');
  core.className = 'core'; core.style.left = CORE.x + 'px'; core.style.top = CORE.y + 'px';
  core.innerHTML = `<div class="tag">CORE · RAFIUL BARI</div>
    <h1>Rafiul Bari</h1>
    <div class="who">blurxy · cybersecurity · NYC College of Technology (CUNY)</div>
    <p class="thesis">How do you know your check <em>actually checked anything?</em></p>
    <p class="sub">I build measurement tools that state what they cannot establish as prominently as what they can. Where a module has a known limit, its spec sheet lists it under Cannot establish.</p>
    <div class="links"><a href="https://github.com/blurxy" target="_blank" rel="noopener" draggable="false">github.com/blurxy</a><a href="#faults" class="toFaults" draggable="false">Fault log</a></div>`;
  world.appendChild(core);

  for (const [label, x, y] of Object.values(ZONES)) {
    const z = document.createElement('div'); z.className = 'zone'; z.textContent = label; z.style.left = x + 'px'; z.style.top = y + 'px'; world.appendChild(z);
  }

  const faults = document.createElement('section');
  faults.className = 'faults'; faults.id = 'faults'; faults.style.left = FAULTS.x + 'px'; faults.style.top = FAULTS.y + 'px';
  faults.innerHTML = `<div class="fh"><span>FAULT LOG · THE RECURRING BUG</span><span class="fcount"></span></div><ol>
    <li><span><code>nmap -sn</code> unprivileged finds 2 hosts; as root, 4. Same command, same network.</span></li>
    <li><span>A TCP probe says the sandbox has no network. DNS still resolves, over a unix socket.</span></li>
    <li><span>A build diff says <code>unchanged</code>. Both builds failed identically.</span></li>
    <li><span><code>pgrep -f pattern</code> returns a hit. The hit is its own command line.</span></li>
    <li><span>52,667 IDS rules loaded, 0 alerts on a port scan. By the rules as written, the enabled scan rules match specific content or count repeats on one port, and the scan touched each port once or twice. The positive-control scan is still to run.</span></li>
    <li><span>Seven unit tests pass. All seven encode the same wrong assumption the code does.</span></li></ol>
    <div class="ff">Same defect, different costumes: <b>a check that is correct about what it examined, and silent about what was actually asked.</b> The fix isn't more tests. It's running the thing against real data you didn't author.</div>`;
  faults.querySelector('.fcount').textContent = String(faults.querySelectorAll('li').length).padStart(2, '0') + ' ENTRIES';
  world.appendChild(faults);
  // The fault log sits right of World Cup and above Cactus, placed from its real height so it never covers a card.
  const placeFaults = () => { FAULTS.y = modEls.cactus.offsetTop - faults.offsetHeight - 40; faults.style.top = FAULTS.y + 'px'; };

  const modEls = {};
  const lastLabel = m => m.lastLabel ?? (/^\d/.test(m.last) ? "last commit" : "");
  function modHTML(m) {
    const lbl = lastLabel(m);
    return `<span class="mh"><span>${m.id}</span><span class="led ${m.status}">${LED[m.status]}</span></span>
      <span class="mb"><span class="mn">${esc(m.name)}</span><span class="md">${esc(m.line)}</span></span>
      <span class="mf"><span><b>${esc(m.lang)}</b></span><span>${lbl ? lbl + " " : ""}<b>${esc(m.last)}</b></span></span>`;
  }
  for (const m of MODS) {
    const b = document.createElement('button'); b.className = 'mod'; b.style.left = m.x + 'px'; b.style.top = m.y + 'px';
    b.dataset.key = m.key; b.setAttribute('aria-haspopup', 'dialog'); b.setAttribute('aria-controls', 'sheet'); b.innerHTML = modHTML(m);
    world.appendChild(b); modEls[m.key] = b;
  }
  $('hMods').textContent = `${MODS.length} MODULES`;

  // traces from core to each module: orthogonal, with a port on each end
  function drawTraces() {
    const svg = $('traces'); const cr = { x: CORE.x, y: CORE.y, w: core.offsetWidth, h: core.offsetHeight };
    let minx = 0, miny = 0, maxx = 0, maxy = 0; const paths = [];
    const cx = cr.x + cr.w / 2, cy = cr.y + cr.h / 2;
    for (const m of MODS) {
      const el = modEls[m.key]; const w = el.offsetWidth, h = el.offsetHeight; const mx = m.x + w / 2, my = m.y + h / 2;
      let sx, sy, ex, ey, d;
      if (Math.abs(mx - cx) > Math.abs(my - cy) * 1.1) {
        sx = mx > cx ? cr.x + cr.w : cr.x; sy = Math.max(cr.y + 24, Math.min(cr.y + cr.h - 24, my));
        ex = mx > cx ? m.x : m.x + w; ey = my; const midx = (sx + ex) / 2;
        d = `M${sx},${sy} H${midx} V${ey} H${ex}`;
      } else {
        sy = my > cy ? cr.y + cr.h : cr.y; sx = Math.max(cr.x + 24, Math.min(cr.x + cr.w - 24, mx));
        ey = my > cy ? m.y : m.y + h; ex = mx; const midy = (sy + ey) / 2;
        d = `M${sx},${sy} V${midy} H${ex} V${ey}`;
      }
      paths.push({ d, k: m.key, sx, sy, ex, ey });
      minx = Math.min(minx, sx, ex); miny = Math.min(miny, sy, ey); maxx = Math.max(maxx, sx, ex); maxy = Math.max(maxy, sy, ey);
    }
    const pad = 20; svg.setAttribute('width', maxx - minx + pad * 2); svg.setAttribute('height', maxy - miny + pad * 2);
    svg.style.left = (minx - pad) + 'px'; svg.style.top = (miny - pad) + 'px';
    svg.setAttribute('viewBox', `${minx - pad} ${miny - pad} ${maxx - minx + pad * 2} ${maxy - miny + pad * 2}`);
    svg.innerHTML = paths.map(p => `<path data-k="${p.k}" d="${p.d}" fill="none" stroke="var(--trace)" stroke-width="1.5"/>
      <rect x="${p.sx - 3.5}" y="${p.sy - 3.5}" width="7" height="7" fill="var(--bg)" stroke="var(--trace)"/>
      <rect x="${p.ex - 3.5}" y="${p.ey - 3.5}" width="7" height="7" fill="var(--bg)" stroke="var(--trace)"/>`).join('');
  }

  // ---------- camera ----------
  const cam = { x: 0, y: 0, s: 1 };
  const clampS = s => Math.min(2.2, Math.max(0.25, s));
  let ptr = null, redraw = 0, dirty = false;   // dirty: the visitor has moved the camera or opened something
  function apply() {
    world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`; world.style.setProperty('--s', cam.s);
    $('hZoom').textContent = `ZOOM ${Math.round(cam.s * 100)}%`; readout();
    if (!redraw) redraw = requestAnimationFrame(() => { redraw = 0; if (!document.body.classList.contains('listmode')) { drawGrid(); drawRulers(); } });
  }
  function readout() {
    if (!ptr) return; const wx = Math.round((ptr.x - cam.x) / cam.s), wy = Math.round((ptr.y - cam.y) / cam.s);
    $('hPos').textContent = `X ${String(wx).padStart(5, ' ')} · Y ${String(wy).padStart(5, ' ')}`;
  }
  function bbox() {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const el of world.children) { if (el.id === 'traces') continue; const x = el.offsetLeft, y = el.offsetTop; minx = Math.min(minx, x); miny = Math.min(miny, y); maxx = Math.max(maxx, x + el.offsetWidth); maxy = Math.max(maxy, y + el.offsetHeight); }
    return { minx, miny, maxx, maxy };
  }
  function fit() {
    const r = stage.getBoundingClientRect(), { minx, miny, maxx, maxy } = bbox();
    const pad = 60, s = clampS(Math.min((r.width - pad * 2) / (maxx - minx), (r.height - pad * 2) / (maxy - miny)));
    cam.s = s; cam.x = (r.width - (maxx - minx) * s) / 2 - minx * s; cam.y = (r.height - (maxy - miny) * s) / 2 - miny * s; apply();
  }
  // Home: the whole board if it fits at 62% or more; otherwise 62% (readable) centred on the whole board, not just the core.
  function home() {
    fit(); if (cam.s >= 0.62) return; const r = stage.getBoundingClientRect(), b = bbox(); cam.s = 0.62;
    cam.x = r.width / 2 - (b.minx + b.maxx) / 2 * cam.s; cam.y = r.height / 2 - (b.miny + b.maxy) / 2 * cam.s; apply();
  }
  function zoomAt(f, px, py) {
    const s = clampS(cam.s * f), k = s / cam.s; cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = s; apply();
  }
  function focusOn(el) {
    const r = stage.getBoundingClientRect(); const s = Math.max(cam.s, 0.9); const sheetW = $('sheet').classList.contains('open') ? Math.min(440, r.width) : 0;
    cam.s = s; cam.x = (r.width - sheetW) / 2 - (el.offsetLeft + el.offsetWidth / 2) * s; cam.y = r.height / 2 - (el.offsetTop + el.offsetHeight / 2) * s; apply();
  }

  // ---------- grid + rulers ----------
  const dpr = () => Math.min(2, window.devicePixelRatio || 1);
  function sizeCanvas(c, w, h) { const d = dpr(); if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); c.style.width = w + 'px'; c.style.height = h + 'px'; } const g = c.getContext('2d'); if (!g) return null; g.setTransform(d, 0, 0, d, 0, 0); return g; }
  function step() { const raw = 100 / cam.s; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 2 ? 1 : n < 5 ? 2 : 5) * p; }
  function drawGrid() {
    const c = $('grid'), r = stage.getBoundingClientRect(), g = sizeCanvas(c, r.width, r.height); if (!g) return; g.clearRect(0, 0, r.width, r.height);
    const css = getComputedStyle(document.documentElement); const minor = 20 * cam.s, major = 100 * cam.s;
    const line = (sp, col) => { if (sp < 6) return; g.strokeStyle = col; g.lineWidth = 1; g.beginPath();
      for (let x = ((cam.x % sp) + sp) % sp; x < r.width; x += sp) { g.moveTo(Math.round(x) + .5, 0); g.lineTo(Math.round(x) + .5, r.height); }
      for (let y = ((cam.y % sp) + sp) % sp; y < r.height; y += sp) { g.moveTo(0, Math.round(y) + .5); g.lineTo(r.width, Math.round(y) + .5); } g.stroke(); };
    line(minor, css.getPropertyValue('--grid')); line(major, css.getPropertyValue('--grid-major'));
    // origin cross
    g.strokeStyle = 'rgba(242,183,5,.35)'; g.beginPath(); g.moveTo(cam.x - 8, cam.y + .5); g.lineTo(cam.x + 8, cam.y + .5); g.moveTo(cam.x + .5, cam.y - 8); g.lineTo(cam.x + .5, cam.y + 8); g.stroke();
  }
  function drawRulers() {
    const r = stage.getBoundingClientRect(), css = getComputedStyle(document.documentElement), mut = css.getPropertyValue('--dim'), font = '10px ' + css.getPropertyValue('--mono');
    const sp = step();
    const gx = sizeCanvas($('rx'), r.width, 22); if (!gx) return; gx.clearRect(0, 0, r.width, 22); gx.fillStyle = mut; gx.strokeStyle = mut; gx.font = font;
    let v0 = Math.floor((-cam.x / cam.s) / sp) * sp;
    for (let v = v0; (v * cam.s + cam.x) < r.width; v += sp) { const x = Math.round(v * cam.s + cam.x) + .5; gx.beginPath(); gx.moveTo(x, 12); gx.lineTo(x, 22); gx.stroke(); gx.fillText(String(Math.round(v)), x + 3, 10);
      for (let t = 1; t < 5; t++) { const tx = Math.round((v + sp * t / 5) * cam.s + cam.x) + .5; gx.beginPath(); gx.moveTo(tx, 18); gx.lineTo(tx, 22); gx.stroke(); } }
    const gy = sizeCanvas($('ry'), 22, r.height); if (!gy) return; gy.clearRect(0, 0, 22, r.height); gy.fillStyle = mut; gy.strokeStyle = mut; gy.font = font;
    v0 = Math.floor((-cam.y / cam.s) / sp) * sp;
    for (let v = v0; (v * cam.s + cam.y) < r.height; v += sp) { const y = Math.round(v * cam.s + cam.y) + .5; gy.beginPath(); gy.moveTo(12, y); gy.lineTo(22, y); gy.stroke();
      gy.save(); gy.translate(10, y - 3); gy.rotate(-Math.PI / 2); gy.fillText(String(Math.round(v)), 0, 0); gy.restore();
      for (let t = 1; t < 5; t++) { const ty = Math.round((v + sp * t / 5) * cam.s + cam.y) + .5; gy.beginPath(); gy.moveTo(18, ty); gy.lineTo(22, ty); gy.stroke(); } }
  }

  // ---------- input ----------
  // Pointer capture starts only once the pointer has moved past 6px: capturing on pointerdown would retarget every click to
  // the stage, so a mouse click on a module or link would do nothing. Keyboard clicks (detail 0) always count.
  let drag = null, moved = 0;
  stage.addEventListener('pointerdown', e => { if (e.button !== 0 || !e.isPrimary) return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, id: e.pointerId }; moved = 0; });
  stage.addEventListener('pointermove', e => {
    if (!e.isPrimary) return;
    const r = stage.getBoundingClientRect(); ptr = { x: e.clientX - r.left, y: e.clientY - r.top };
    $('xv').hidden = $('xhz').hidden = false; $('xv').style.left = ptr.x + 'px'; $('xhz').style.top = ptr.y + 'px'; readout();
    if (drag && e.pointerType === 'mouse' && !(e.buttons & 1)) { end(); return; }   // released outside the page: stop following the cursor
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved <= 6) return;
    if (!stage.hasPointerCapture(drag.id)) { try { stage.setPointerCapture(drag.id); } catch (_) {} stage.classList.add('drag'); dirty = true; }
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply();
  });
  const end = e => { if (e && !e.isPrimary) return; drag = null; stage.classList.remove('drag'); };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end); window.addEventListener('blur', () => end());
  stage.addEventListener('pointerleave', () => { ptr = null; $('xv').hidden = $('xhz').hidden = true; });
  stage.addEventListener('wheel', e => { e.preventDefault(); dirty = true; const r = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  stage.addEventListener('click', e => { if (moved > 6 && e.detail !== 0) { moved = 0; return; } const b = e.target.closest('.mod'); if (b) open(b.dataset.key); });
  // Tab to a module that is off screen: pan it into view (no zoom change) instead of letting the stage scroll.
  stage.addEventListener('focusin', e => {
    if (drag || !e.target.matches(':focus-visible')) return;   // a mouse or touch press is about to click it: don't move it away
    let el = e.target.closest('.mod, .core, .faults'); if (!el) return;
    const r = stage.getBoundingClientRect(), m = 40, right = r.right - ($('sheet').classList.contains('open') ? Math.min(440, r.width) : 0);
    let b = el.getBoundingClientRect(); if (b.height > r.height - 2 * m || b.width > right - r.left - 2 * m) { el = e.target; b = el.getBoundingClientRect(); }
    let dx = 0, dy = 0;
    if (b.left < r.left + m) dx = r.left + m - b.left; else if (b.right > right - m) dx = Math.max(right - m - b.right, r.left + m - b.left);
    if (b.top < r.top + m) dy = r.top + m - b.top; else if (b.bottom > r.bottom - m) dy = Math.max(r.bottom - m - b.bottom, r.top + m - b.top);
    if (dx || dy) { cam.x += dx; cam.y += dy; dirty = true; apply(); }
  });
  $('zIn').onclick = () => { dirty = true; const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
  $('zOut').onclick = () => { dirty = true; const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
  $('zFit').onclick = () => { dirty = true; close(); fit(); };
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || !(e.target instanceof Element)) return;   // leave browser zoom and shortcuts alone
    if (e.target.closest('input,textarea,select')) return;
    if (e.key === 'Escape') { close(); return; }
    if (document.body.classList.contains('sheetopen') || e.target.closest('#sheet, #list') || !$('list').hidden) return;
    const k = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[e.key];
    if (k) { e.preventDefault(); dirty = true; cam.x += k[0]; cam.y += k[1]; apply(); }
    if (e.key === '+' || e.key === '=') { dirty = true; $('zIn').click(); }
    if (e.key === '-') { dirty = true; $('zOut').click(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.toFaults')) return; e.preventDefault();
    if ($('list').hidden) { dirty = true; focusOn(faults); faults.tabIndex = -1; faults.focus({ preventScroll: true }); }
    else { const f = $('list').querySelector('.faults'); if (f) { f.tabIndex = -1; f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); f.focus({ preventScroll: true }); } }
  });

  // ---------- spec sheet ----------
  function sheetHTML(m) {
    const acts = m.links.map(([t, u], i) => u === "#" ? `<span class="soon">${esc(t)}</span>` : `<a class="${i ? "" : "pri"}" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("");
    const flags = s => esc(s).replace(/(^|\s)(--[a-z][a-z-]*)/g, '$1<code>$2</code>');   // keep CLI flags like --static on one line
    const lbl = lastLabel(m);
    return `<div class="sh-top"><span>${m.id} · ${LED[m.status]}</span><button class="tbtn" id="shClose">Close<span class="kbd"> · Esc</span></button></div>
      <h2 id="shTitle" tabindex="-1">${esc(m.name)}</h2><p class="lead">${esc(m.line)}</p>
      <div class="acts">${acts}</div>
      <dl class="spec"><div><dt>Measures</dt><dd>${esc(m.measures)}</dd></div><div><dt>Stack</dt><dd>${esc(m.lang)}</dd></div><div><dt>${lbl ? lbl : "Version"}</dt><dd>${esc(m.last)}</dd></div></dl>
      ${m.facts.length ? `<div class="blk"><h3>Measured</h3><ul>${m.facts.map(f => `<li>${flags(f)}</li>`).join("")}</ul></div>` : ""}
      ${m.cant.length ? `<div class="blk cant"><h3>Cannot establish</h3><ul>${m.cant.map(f => `<li>${flags(f)}</li>`).join("")}</ul></div>` : ""}`;
  }
  let current = null, opener = null;
  function open(key) {
    const m = MODS.find(x => x.key === key); if (!m) return; current = key; dirty = true;
    const a = document.activeElement; if (a && a !== document.body && !a.closest('#sheet')) opener = a;
    const sh = $('sheet'); sh.innerHTML = sheetHTML(m); sh.inert = false; sh.scrollTop = 0; sh.classList.add('open'); document.body.classList.add('sheetopen');
    if (window.innerWidth <= 760) { $('list').inert = true; stage.inert = true; }   // the sheet covers the whole screen: keep Tab inside it
    document.querySelectorAll('.mod').forEach(el => el.setAttribute('aria-expanded', String(el.dataset.key === key)));
    Object.values(modEls).forEach(el => el.classList.toggle('sel', el.dataset.key === key));
    $('traces').querySelectorAll('path').forEach(p => { const on = p.dataset.k === key; p.setAttribute('stroke', on ? 'var(--amber)' : 'var(--trace)'); p.setAttribute('stroke-width', on ? 2 : 1.5); });
    $('crumb').textContent = `board / rafiul-bari / ${m.id.toLowerCase()} ${m.name}`;
    $('shClose').onclick = close; $('shTitle').focus({ preventScroll: true }); $('live').textContent = `${m.name} spec sheet opened`;
    if ($('list').hidden) focusOn(modEls[key]);
  }
  function close() {
    if (!current) return; const key = current; current = null;
    const sh = $('sheet'); sh.classList.remove('open'); sh.inert = true; document.body.classList.remove('sheetopen');
    $('list').inert = false; stage.inert = !$('list').hidden;
    document.querySelectorAll('.mod').forEach(el => el.setAttribute('aria-expanded', 'false'));
    setTimeout(() => { if (!current) sh.innerHTML = ''; }, 260);   // after the slide-out, so no stale links stay behind
    Object.values(modEls).forEach(el => el.classList.remove('sel'));
    $('traces').querySelectorAll('path').forEach(p => { p.setAttribute('stroke', 'var(--trace)'); p.setAttribute('stroke-width', 1.5); });
    $('crumb').textContent = 'board / rafiul-bari / all modules';
    const shown = el => el && el.isConnected && el.getClientRects().length && !el.closest('[inert],[hidden]');
    const back = shown(opener) ? opener : ($('list').hidden ? modEls[key] : $('list').querySelector(`.mod[data-key="${key}"]`));
    opener = null; if (shown(back)) back.focus({ preventScroll: true });
  }

  // ---------- list view ----------
  function buildList() {
    const inner = $('listInner'); inner.innerHTML = "";
    const c = core.cloneNode(true); c.querySelectorAll('[id]').forEach(el => el.removeAttribute('id')); inner.appendChild(c);
    for (const z of ["live", "measure", "sim", "systems"]) {
      const h = document.createElement('div'); h.className = 'zone'; h.textContent = ZONES[z][0]; inner.appendChild(h);
      const grid = document.createElement('div'); grid.className = 'mods';
      for (const m of MODS.filter(x => x.zone === z)) { const b = document.createElement('button'); b.className = 'mod'; b.dataset.key = m.key; b.setAttribute('aria-haspopup', 'dialog'); b.setAttribute('aria-controls', 'sheet'); b.innerHTML = modHTML(m); b.onclick = () => open(m.key); grid.appendChild(b); }
      inner.appendChild(grid);
    }
    const f = faults.cloneNode(true); f.removeAttribute('id'); inner.appendChild(f);
  }
  function setView(v) {
    const list = v === 'list'; if (list === !$('list').hidden) return;   // already there: clicking the active view does nothing
    $('list').hidden = !list; $('vList').setAttribute('aria-pressed', String(list)); $('vBoard').setAttribute('aria-pressed', String(!list));
    document.body.classList.toggle('listmode', list);
    stage.inert = list; document.querySelector('.zoomer').inert = list;   // the covered board leaves the tab order and the accessibility tree
    if (list) buildList(); else requestAnimationFrame(() => { home(); if (current) focusOn(modEls[current]); });
  }
  $('vBoard').onclick = () => setView('board'); $('vList').onclick = () => setView('list');

  // One breakpoint for CSS and JS. Narrowing past it switches to the list; widening keeps whatever view is showing.
  const narrow = matchMedia('(max-width: 760px)');
  narrow.addEventListener('change', e => { requestAnimationFrame(drawTraces); if (e.matches) setView('list'); });
  let rz = 0;
  window.addEventListener('resize', () => { if (rz) return; rz = requestAnimationFrame(() => { rz = 0; if (!$('list').hidden) return; if (!dirty) home(); else apply(); if (current) focusOn(modEls[current]); }); });
  requestAnimationFrame(() => { if (narrow.matches) setView('list'); placeFaults(); drawTraces(); if ($('list').hidden) home(); });
  document.fonts && document.fonts.ready.then(() => { placeFaults(); drawTraces(); if ($('list').hidden && !dirty) home(); });
})();
</script>
